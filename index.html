<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F3F6F4" />
    <title>Как устроен BTRFS — Артём Кудяков</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="presentation" aria-label="Как устроен BTRFS">
      <div id="stage" tabindex="0" aria-label="Слайд. Пробел — следующий шаг"></div>
      <div id="loading" role="status">Загружаем презентацию…</div>
      <nav id="controls" aria-label="Управление презентацией">
        <button id="previous" title="Назад · ←" aria-label="Предыдущий шаг">←</button>
        <button id="next" title="Дальше · пробел или →" aria-label="Следующий шаг">→</button>
        <select id="scene" aria-label="Выбрать слайд" disabled></select>
        <span id="step" aria-live="polite"></span>
        <button id="fullscreen" title="Полный экран · F" aria-label="Полный экран">⛶</button>
      </nav>
    </main>
    <script type="module" src="/src/site/main.ts"></script>
  </body>
</html>
